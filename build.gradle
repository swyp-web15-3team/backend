plugins {
	id 'java'
    id 'checkstyle'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '7.2.1'
}

group = 'com.team3'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.1'
	implementation 'org.flywaydb:flyway-core'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('installGitHooks', Exec) {
	group = 'git'
	description = 'Configure Git hooks'
	commandLine 'git', 'config', 'core.hooksPath', '.githooks'

	doLast {
		fileTree('.githooks').forEach {
			it.setExecutable(true)
		}
		println 'Git hooks configured.'
	}
}

tasks.named('bootRun') {
    systemProperty 'spring.profiles.default', 'local'
}

checkstyle {
	toolVersion = '12.1.1'
	maxWarnings = 0
}

tasks.named("check") {
    dependsOn("spotlessCheck")
}

spotless {
  java {
	  eclipse('4.34').configFile('config/eclipse-formatter.prefs')
	  removeUnusedImports()
	  formatAnnotations()
	  trimTrailingWhitespace()
	  endWithNewline()
  }
}
