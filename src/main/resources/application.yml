spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: backend
    access-ttl: 15m
    refresh-ttl: 14d
  kakao:
    enabled: ${KAKAO_LOGIN_ENABLED:false}
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    admin-key: ${KAKAO_ADMIN_KEY:}
